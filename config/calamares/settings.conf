# =============================================================================
# Calamares settings — SharkOS Dragon Edition
# Minimal configuration : délègue aux modules standards Calamares (welcome,
# partition, mount, unpackfs, machineid, fstab, locale, keyboard, users,
# displaymanager, network, summary, exec) en pointant vers notre install-cycle.
# =============================================================================

--- !CalamaresConfiguration
productName:        SharkOS Dragon Edition
version:            2.0
shortVersion:       2.0
displayName:        SharkOS Dragon Edition
displayVersion:     2.0

branding:           sharkos
brandingShortName:  sharkos

# Répertoires de configuration (installés par hook 50 dans /etc/calamares/sharkos)
modulesSearchPaths:
    - /etc/calamares/sharkos/modules
    - /usr/lib/x86_64-linux-gnu/calamares/modules

# Modules exécutés dans l'ordre — choisis pour couvrir toute l'installation
# du live-USB au disque dur avec le compte shark/shark.
sequence:
    - welcome
    - locale
    - keyboard
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - hostinfo
    - sharkos-install-cycle   ← module custom qui rshell nos hooks
    - displaymanager
    - network
    - summary
    - exec

# Le module sharkos-install-cycle lance /usr/local/bin/sharkos-install-cycle.sh
# au sein du chroot Calamares, ce qui ré-exécute nos hooks 10→60 dans la cible.

requireConfigVersion: 3
---
