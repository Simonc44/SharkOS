# =============================================================================
# 🦈 SharkOS — GitHub Actions CI/CD
# Vérifie la syntaxe, la structure, la cohérence du projet
# et simule un chroot Debian pour valider les hooks
# =============================================================================

name: 🦈 SharkOS CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      full_build:
        description: 'Lancer une build ISO complète (lente ~40 min)'
        required: false
        default: 'false'
        type: boolean

# ===========================================================================
# PERMISSIONS
# ===========================================================================
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:

  # =========================================================================
  # JOB 1 — LINT & SYNTAXE SHELL
  # =========================================================================
  lint-shell:
    name: "🔍 Lint Shell (ShellCheck)"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: ShellCheck — scripts/
        run: |
          echo "🦈 Vérification syntaxe : scripts/"
          shellcheck --severity=warning \
            scripts/00-bootstrap.sh \
            scripts/01-build-iso.sh \
            scripts/02-flash-usb.sh
          echo "✅ scripts/ OK"

      - name: ShellCheck — chroot-hooks/
        run: |
          echo "🦈 Vérification syntaxe : chroot-hooks/"
          shellcheck --severity=warning \
            chroot-hooks/10-install-tools.sh \
            chroot-hooks/20-apply-theme.sh \
            chroot-hooks/30-configure-shell.sh \
            chroot-hooks/40-cleanup.sh
          echo "✅ chroot-hooks/ OK"

  # =========================================================================
  # JOB 2 — VÉRIFICATION DE STRUCTURE DU PROJET
  # =========================================================================
  check-structure:
    name: "📁 Structure du projet"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier tous les fichiers obligatoires
        run: |
          echo "🦈 Vérification de la structure SharkOS..."

          MISSING=0
          check_file() {
            if [[ ! -f "$1" ]]; then
              echo "  ❌ MANQUANT : $1"
              MISSING=$((MISSING + 1))
            else
              echo "  ✅ OK : $1"
            fi
          }
          check_dir() {
            if [[ ! -d "$1" ]]; then
              echo "  ❌ DOSSIER MANQUANT : $1"
              MISSING=$((MISSING + 1))
            else
              echo "  ✅ OK (dossier) : $1"
            fi
          }

          echo ""
          echo "--- Scripts ---"
          check_file "scripts/00-bootstrap.sh"
          check_file "scripts/01-build-iso.sh"
          check_file "scripts/02-flash-usb.sh"

          echo ""
          echo "--- Hooks chroot ---"
          check_file "chroot-hooks/10-install-tools.sh"
          check_file "chroot-hooks/20-apply-theme.sh"
          check_file "chroot-hooks/30-configure-shell.sh"
          check_file "chroot-hooks/40-cleanup.sh"

          echo ""
          echo "--- Config ---"
          check_file "config/.zshrc"
          check_file "config/plank.dconf"
          check_file "config/xfce4-panel.xml"

          echo ""
          echo "--- Documentation ---"
          check_file "README.md"
          check_file "INSTRUCTIONS.md"

          echo ""
          echo "--- Dossiers ---"
          check_dir "wallpapers"
          check_dir "iso-build"
          check_dir ".github/workflows"

          echo ""
          if [[ $MISSING -gt 0 ]]; then
            echo "❌ $MISSING fichier(s) manquant(s) !"
            exit 1
          else
            echo "✅ Structure complète — tous les fichiers sont présents."
          fi

      - name: Vérifier que pas de SVG dans wallpapers/
        run: |
          echo "🦈 Vérification : aucun SVG dans wallpapers/..."
          if find wallpapers/ -name "*.svg" 2>/dev/null | grep -q ".svg"; then
            echo "❌ Des fichiers .svg ont été trouvés dans wallpapers/ !"
            echo "   SharkOS utilise uniquement des PNG."
            find wallpapers/ -name "*.svg"
            exit 1
          else
            echo "✅ Aucun SVG trouvé dans wallpapers/ — OK"
          fi

      - name: Vérifier que les hooks sont exécutables (contenu)
        run: |
          echo "🦈 Vérification : hooks commencent par #!/usr/bin/env bash..."
          for HOOK in chroot-hooks/*.sh; do
            FIRST=$(head -1 "$HOOK")
            if [[ "$FIRST" != "#!/usr/bin/env bash" ]]; then
              echo "  ❌ $HOOK — shebang incorrect : $FIRST"
              exit 1
            else
              echo "  ✅ $HOOK"
            fi
          done

      - name: Vérifier la cohérence du .zshrc
        run: |
          echo "🦈 Vérification du .zshrc..."
          ZSHRC="config/.zshrc"
          CHECKS=(
            "update-system"
            "ZSH_THEME=\"agnoster\""
            "SharkOS"
            "alias dir="
            "alias cls="
            "alias ipconfig="
            "alias sharkscan="
            "alias sharkfw="
            "alias sharkav="
          )
          FAIL=0
          for CHECK in "${CHECKS[@]}"; do
            if grep -q "$CHECK" "$ZSHRC"; then
              echo "  ✅ Trouvé : $CHECK"
            else
              echo "  ❌ ABSENT : $CHECK"
              FAIL=$((FAIL + 1))
            fi
          done
          if [[ $FAIL -gt 0 ]]; then
            echo "❌ $FAIL élément(s) manquant(s) dans le .zshrc !"
            exit 1
          fi
          echo "✅ .zshrc complet"

  # =========================================================================
  # JOB 3 — SIMULATION CHROOT (Debian Bookworm container)
  # Vérifie que les hooks sont syntaxiquement exécutables dans un vrai Debian
  # =========================================================================
  test-hooks-debian:
    name: "🐧 Test hooks dans Debian Bookworm"
    runs-on: ubuntu-22.04
    container:
      image: debian:bookworm-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer les dépendances de test minimales
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            bash shellcheck git curl wget ca-certificates \
            lsb-release 2>/dev/null || true

      - name: Dry-run Hook 10 (syntaxe bash -n)
        run: |
          echo "🦈 Syntaxe bash -n : 10-install-tools.sh"
          bash -n chroot-hooks/10-install-tools.sh && echo "✅ OK" || exit 1

      - name: Dry-run Hook 20 (syntaxe bash -n)
        run: |
          echo "🦈 Syntaxe bash -n : 20-apply-theme.sh"
          bash -n chroot-hooks/20-apply-theme.sh && echo "✅ OK" || exit 1

      - name: Dry-run Hook 30 (syntaxe bash -n)
        run: |
          echo "🦈 Syntaxe bash -n : 30-configure-shell.sh"
          bash -n chroot-hooks/30-configure-shell.sh && echo "✅ OK" || exit 1

      - name: Dry-run Hook 40 (syntaxe bash -n)
        run: |
          echo "🦈 Syntaxe bash -n : 40-cleanup.sh"
          bash -n chroot-hooks/40-cleanup.sh && echo "✅ OK" || exit 1

      - name: Dry-run scripts principaux (syntaxe bash -n)
        run: |
          for SCRIPT in scripts/*.sh; do
            echo "🦈 bash -n : $SCRIPT"
            bash -n "$SCRIPT" && echo "  ✅ OK" || exit 1
          done

      - name: Vérifier les commandes critiques référencées dans les hooks
        shell: bash
        run: |
          echo "🦈 Vérification des commandes systèmes référencées..."
          COMMANDS_TO_CHECK=(
            "bash" "git" "curl" "apt-get" "dpkg"
            "systemctl" "chmod" "mkdir" "cp" "rm"
            "find" "cat" "grep" "sed" "awk"
          )
          MISSING=0
          for CMD in "${COMMANDS_TO_CHECK[@]}"; do
            if command -v "$CMD" &>/dev/null; then
              echo "  ✅ $CMD"
            else
              echo "  ⚠️  $CMD non trouvé dans cet environnement (normal en CI)"
            fi
          done
          echo "✅ Vérification commandes terminée"

  # =========================================================================
  # JOB 4 — VÉRIFICATION XML/CONFIG XFCE
  # =========================================================================
  check-configs:
    name: "⚙️ Validation configs XML & dconf"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer xmllint
        run: sudo apt-get install -y libxml2-utils

      - name: Valider xfce4-panel.xml
        run: |
          echo "🦈 Validation XML : config/xfce4-panel.xml"
          xmllint --noout config/xfce4-panel.xml && echo "✅ XML valide" || exit 1

      - name: Vérifier plank.dconf
        run: |
          echo "🦈 Vérification plank.dconf..."
          if grep -q "position='bottom'" config/plank.dconf || \
             grep -q "Position=3" config/plank.dconf; then
            echo "✅ Plank dock positionné en bas — OK"
          else
            echo "⚠️  Position Plank non détectée (format clé différent, vérifier)"
          fi
          if grep -q "zoom" config/plank.dconf || \
             grep -q "Zoom" config/plank.dconf; then
            echo "✅ Zoom Plank configuré — OK"
          fi

      - name: Vérifier la liste de paquets dans 01-build-iso.sh
        run: |
          echo "🦈 Vérification paquets clés dans la liste..."
          SCRIPT="scripts/01-build-iso.sh"
          PACKAGES=(
            "xfce4" "plank" "zsh" "nmap" "wireshark"
            "ufw" "clamav" "snapd" "flatpak"
            "macchanger" "wine" "firefox-esr"
          )
          FAIL=0
          for PKG in "${PACKAGES[@]}"; do
            if grep -q "$PKG" "$SCRIPT"; then
              echo "  ✅ $PKG"
            else
              echo "  ❌ $PKG absent de la liste de paquets !"
              FAIL=$((FAIL + 1))
            fi
          done
          if [[ $FAIL -gt 0 ]]; then
            echo "❌ $FAIL paquet(s) manquant(s) dans la liste !"
            exit 1
          fi
          echo "✅ Tous les paquets clés présents"

  # =========================================================================
  # JOB 5 — RAPPORT FINAL
  # =========================================================================
  summary:
    name: "📊 Rapport CI SharkOS"
    runs-on: ubuntu-22.04
    needs: [lint-shell, check-structure, test-hooks-debian, check-configs]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Générer le rapport
        run: |
          echo ""
          echo "🦈 ========================================================"
          echo "   SharkOS CI — Rapport final"
          echo "======================================================== 🦈"
          echo ""
          echo "  Commit    : ${{ github.sha }}"
          echo "  Branche   : ${{ github.ref_name }}"
          echo "  Déclencheur : ${{ github.event_name }}"
          echo "  Date      : $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""

          # Compter les fichiers
          SCRIPTS=$(find scripts/ -name "*.sh" | wc -l)
          HOOKS=$(find chroot-hooks/ -name "*.sh" | wc -l)
          CONFIGS=$(find config/ -type f | wc -l)
          TOTAL_LINES=$(find . -name "*.sh" -not -path "./.git/*" | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}')

          echo "  📁 Scripts      : $SCRIPTS"
          echo "  🪝 Hooks chroot : $HOOKS"
          echo "  ⚙️  Configs      : $CONFIGS"
          echo "  📝 Total lignes : $TOTAL_LINES"
          echo ""

          # Status des jobs
          echo "  Jobs :"
          echo "    🔍 Lint Shell        : ${{ needs.lint-shell.result }}"
          echo "    📁 Structure         : ${{ needs.check-structure.result }}"
          echo "    🐧 Test Debian       : ${{ needs.test-hooks-debian.result }}"
          echo "    ⚙️  Configs XML       : ${{ needs.check-configs.result }}"
          echo ""

          # Résultat global
          if [[ "${{ needs.lint-shell.result }}"       == "success" ]] && \
             [[ "${{ needs.check-structure.result }}"  == "success" ]] && \
             [[ "${{ needs.test-hooks-debian.result }}" == "success" ]] && \
             [[ "${{ needs.check-configs.result }}"    == "success" ]]; then
            echo "  🦈 RÉSULTAT GLOBAL : ✅ TOUT EST OK — SharkOS est prêt à builder !"
          else
            echo "  🦈 RÉSULTAT GLOBAL : ❌ Des erreurs ont été détectées — voir les jobs ci-dessus."
            exit 1
          fi

          echo ""
          echo "======================================================== 🦈"

  # =========================================================================
  # JOB 6 — BUILD ISO COMPLÈTE (optionnel, déclenché manuellement)
  # =========================================================================
  full-iso-build:
    name: "🏗️ Build ISO complète (manuel)"
    runs-on: ubuntu-22.04
    needs: [lint-shell, check-structure, test-hooks-debian, check-configs]
    if: github.event.inputs.full_build == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Créer wallpaper.png de test (PNG placeholder)
        run: |
          sudo apt-get install -y imagemagick
          mkdir -p wallpapers
          convert -size 1920x1080 xc:'#0a0a0f' \
            -font DejaVu-Sans-Bold -pointsize 80 \
            -fill '#1a8cff' -gravity center \
            -annotate +0-40 'SharkOS' \
            -pointsize 20 -fill '#ffffff' \
            -annotate +0+60 'Rapide. Furtif. Letal.' \
            wallpapers/wallpaper.png
          convert -size 512x512 xc:'#0a0a0f' \
            -font DejaVu-Sans-Bold -pointsize 200 \
            -fill '#1a8cff' -gravity center \
            -annotate +0+0 'S' \
            wallpapers/logo.png
          echo "✅ Wallpapers PNG de test créés"

      - name: Installer live-build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            live-build squashfs-tools xorriso isolinux \
            syslinux-utils syslinux-common genisoimage \
            git curl wget ca-certificates debootstrap \
            rsync dconf-cli

      - name: Bootstrap SharkOS
        run: sudo bash scripts/00-bootstrap.sh

      - name: Build ISO SharkOS
        run: sudo bash scripts/01-build-iso.sh
        timeout-minutes: 90

      - name: Upload ISO comme artifact GitHub
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SharkOS-ISO-${{ github.sha }}
          path: SharkOS.iso
          retention-days: 7

      - name: Rapport build ISO
        if: always()
        run: |
          if [[ -f "SharkOS.iso" ]]; then
            SIZE=$(du -sh SharkOS.iso | cut -f1)
            echo "🦈 ISO générée avec succès : SharkOS.iso ($SIZE)"
          else
            echo "❌ Aucune ISO générée."
            exit 1
          fi
