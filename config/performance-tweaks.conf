# =============================================================================
# SharkOS Dragon Edition — Performance Tweaks
# Inspiré Garuda Linux : https://wiki.garudalinux.org/en/performance-tweaks
# =============================================================================

[kernel]
# Kernel recommandé : XanMod LTS (gaming/low-latency, scheduler + BBRv3 + MGLRU)
# NB : Liquorix n'existe pas pour Debian — XanMod est l'équivalent officiel bookworm.
# Fallback : linux-image-amd64 (Debian default)
preferred = linux-xanmod-lts-x64v2
fallback = linux-image-amd64

[zram]
# Compression RAM zstd — Garuda active 50% RAM en swap zstd
enabled = true
ratio = 50
algorithm = zstd
priority = 100

[sysctl]
# VM
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Réseau
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_fastopen = 3

# I/O
vm.page-cluster = 0
kernel.nmi_watchdog = 0

# Fluidité interaction (autogroup évite les à-coups quand plusieurs apps tournent)
kernel.sched_autogroup_enabled = 1
# Writeback plus fréquent → moins de gel disque sous charge
vm.dirty_writeback_centisecs = 500
vm.dirty_expire_centisecs = 3000

[cpugovernor]
# Governor CPU au boot (fluidité) : schedutil (bonne latence) ou performance
# shark-turbo on → performance ; shark-turbo off → schedutil
governor = schedutil

[ioscheduler]
# Pour SSD/NVMe : none ou mq-deadline
# Pour HDD : bfq
ssd = none
hdd = bfq
nvme = none

[services]
# Services performance activés
irqbalance = enabled
thermald = enabled
nohang = enabled
fstrim.timer = enabled
sharkos-zram = enabled
sharkos-mac-randomize = enabled

[gaming]
# GameMode : active automatiquement quand un jeu tourne
gamemode = enabled
# MangoHud : overlay FPS/CPU/GPU/RAM
mangohud = enabled
# Commande : gamemoderun env MANGOHUD=1 <jeu>
game_launcher = sharkgame
